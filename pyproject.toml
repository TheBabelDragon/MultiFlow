[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiflow"
version = "0.2.0"
description = "General-purpose scheduling and constraint-arbitration engine for systems with shared resources"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheBabelDragon" }]
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
]
cp-sat = [
    "ortools>=9.8",
]
milp = [
    "pulp>=2.8",
]
all = [
    "multiflow[cp-sat,milp]",
]

[project.scripts]
multiflow-demo = "multiflow.demo.corporate:main"
multiflow = "multiflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
