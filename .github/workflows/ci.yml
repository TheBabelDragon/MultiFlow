name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q --cov=multiflow --cov-report=term-missing
      - name: Demo smoke
        run: PYTHONPATH=src python -m multiflow.demo.corporate
      - name: CLI solve simple
        run: PYTHONPATH=src python -m multiflow.cli solve examples/simple.json
